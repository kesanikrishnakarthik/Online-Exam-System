spring.application.name=online-exam

server.port=8081

# Persistent Relational Database Configuration
# File-based H2 stores all colleges, users, questions, exams, attempts, and results on disk in ./data/onlineexamdb.mv.db
# Fully overridable via environment variables (e.g. for PostgreSQL/MySQL in Docker Compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/onlineexamdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Automatic Schema Migration / Update (Preserves existing records across restarts)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.open-in-view=true

# Web H2 Console for Inspection (Only active when H2 driver is used)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security, Platform Governance & Data Seeding Controls
app.seed.test-data=${APP_SEED_TEST_DATA:false}
app.clean-demo-data=${APP_CLEAN_DEMO_DATA:true}
superadmin.username=${SUPERADMIN_USERNAME:superadmin}
superadmin.password=${SUPERADMIN_PASSWORD:}
superadmin.email=${SUPERADMIN_EMAIL:superadmin@collegeconnect.edu}

