<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | CollegeConnect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
            padding: 20px;
            color: #1e293b;
        }
        .error-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .code-badge {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 800;
            font-size: 14px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid #bfdbfe;
        }
        h1 { font-size: 24px; color: #0f172a; margin-bottom: 10px; font-weight: 800; }
        p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .action-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin: 6px;
        }
        .action-btn:hover { background: #1d4ed8; }
        .action-btn-outline {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        .action-btn-outline:hover { background: #e2e8f0; }
    </style>
</head>
<body>
<div class="error-card">
    <div style="font-size: 48px; margin-bottom: 10px;">🔍</div>
    <span class="code-badge">HTTP 404 • NOT FOUND</span>
    <h1>Requested Page Not Found</h1>
    <p>
        The page or examination resource you are attempting to view does not exist, has been archived, or moved.
    </p>
    <div>
        <a href="/" class="action-btn">Return to Homepage</a>
        <a href="/login" class="action-btn action-btn-outline">Sign In</a>
    </div>
</div>
</body>
</html>
