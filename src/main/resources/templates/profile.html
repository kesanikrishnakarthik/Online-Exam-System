
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Online Exam</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px #00000010;
        }

        h1 {
            color: #2563eb;
        }

        .profile-item {
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>
<body>
<header>
    <h2>Online Exam</h2>
    <a href="/dashboard">Dashboard</a>
</header>

<main>
    <div class="profile-card">
        <h1>My Profile</h1>

        <div class="profile-item">
            <strong>Username:</strong>
            <span th:text="${username}">user</span>
        </div>

        <div class="profile-item">
            <strong>Role:</strong>
            <span th:text="${role}">STUDENT</span>
        </div>

        <a class="back-button" href="/dashboard">Back to Dashboard</a>
    </div>
</main>
</body>
</html>
