<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Question Bank - Faculty Panel</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 850px;
            margin: 35px auto;
            padding: 0 20px 50px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input, textarea, select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-add {
            background: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-add:hover {
            background: #1d4ed8;
        }

        .btn-done {
            display: inline-block;
            background: #15803d;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin-left: 10px;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .question-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px;
            margin-top: 14px;
        }

        .question-item h4 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>
<header>
    <h2>Faculty Examination Portal</h2>
    <a href="/faculty/exams">← Return to Exams</a>
</header>

<div class="container">
    <div class="card">
        <h1 th:text="${exam.title}">Java Programming</h1>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 20px;">
            Subject: <strong th:text="${exam.subject}">Java</strong> |
            Current Total Marks: <strong th:text="${exam.totalMarks}">20</strong>
        </p>

        <div th:if="${successMessage}" class="alert-success" th:text="${successMessage}">
            Question added successfully!
        </div>

        <form th:action="@{/faculty/exam/{id}/add-question(id=${exam.id})}" method="post">
            <div class="form-group">
                <label for="questionText">Question Text</label>
                <textarea id="questionText" name="questionText" placeholder="Enter multiple-choice question prompt..." required></textarea>
            </div>

            <div class="grid-options">
                <div class="form-group">
                    <label for="optionA">Option A</label>
                    <input type="text" id="optionA" name="optionA" placeholder="Option A text" required>
                </div>
                <div class="form-group">
                    <label for="optionB">Option B</label>
                    <input type="text" id="optionB" name="optionB" placeholder="Option B text" required>
                </div>
                <div class="form-group">
                    <label for="optionC">Option C</label>
                    <input type="text" id="optionC" name="optionC" placeholder="Option C text" required>
                </div>
                <div class="form-group">
                    <label for="optionD">Option D</label>
                    <input type="text" id="optionD" name="optionD" placeholder="Option D text" required>
                </div>
            </div>

            <div class="grid-options">
                <div class="form-group">
                    <label for="correctAnswer">Correct Answer Key</label>
                    <select id="correctAnswer" name="correctAnswer" required>
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="marks">Question Marks</label>
                    <input type="number" id="marks" name="marks" value="4" min="1" max="100" required>
                </div>
            </div>

            <div>
                <button type="submit" class="btn-add">+ Add Question</button>
                <a href="/faculty/exams" class="btn-done">✓ Finish & Publish</a>
            </div>
        </form>
    </div>

    <div class="card">
        <h2>Existing Questions (<span th:text="${#lists.size(questions)}">0</span>)</h2>
        <div th:if="${#lists.isEmpty(questions)}" style="color: #64748b; font-size: 14px; margin-top: 10px;">
            No questions added to this exam yet.
        </div>

        <div class="question-item" th:each="q, stat : ${questions}">
            <h4>
                <span th:text="${stat.count}">1</span>.
                <span th:text="${q.questionText}">Question</span>
                <span style="float: right; font-size: 12px; color: #16a34a; font-weight: 700;">
                    [<span th:text="${q.marks}">4</span> Marks]
                </span>
            </h4>
            <div style="font-size: 13px; color: #475569; line-height: 1.6;">
                <div>A: <span th:text="${q.optionA}"></span></div>
                <div>B: <span th:text="${q.optionB}"></span></div>
                <div>C: <span th:text="${q.optionC}"></span></div>
                <div>D: <span th:text="${q.optionD}"></span></div>
                <div style="margin-top: 6px; font-weight: 700; color: #15803d;">
                    Correct Key: Option <span th:text="${q.correctAnswer}">B</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
