<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - CollegeConnect</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
            padding: 30px 15px;
            color: #1e293b;
        }

        .card-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            padding: 36px;
        }

        .header-box {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-key {
            font-size: 38px;
            margin-bottom: 10px;
        }

        h1 {
            color: #0f172a;
            font-size: 22px;
            font-weight: 800;
        }

        p {
            color: #64748b;
            font-size: 13px;
            margin-top: 6px;
            line-height: 1.5;
        }

        .alert-error {
            padding: 12px 16px;
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .hint-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #15803d;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            padding-top: 16px;
            border-top: 1px solid #f1f5f9;
        }

        .footer-links a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="card-container">
    <div class="header-box">
        <div class="icon-key">🔑</div>
        <h1>Create New Password</h1>
        <p>Set a secure password for your institutional account</p>
    </div>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}">
        Error occurred.
    </div>

    <!-- If token is valid, display form -->
    <div th:if="${token}">
        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" minlength="6" required autofocus>
                <div class="hint-text">Minimum 6 characters</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" minlength="6" required>
            </div>

            <button type="submit" class="submit-btn">Update & Save Password</button>
        </form>
    </div>

    <!-- If token is invalid or expired -->
    <div th:unless="${token}" style="text-align: center; margin-top: 15px;">
        <a href="/forgot-password" class="submit-btn" style="display: block; text-decoration: none; background: #2563eb;">Request New Reset Link</a>
    </div>

    <div class="footer-links">
        <a href="/login">&larr; Return to Sign In</a>
    </div>
</div>
</body>
</html>
