<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - College Online Examination System</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/js/firebase-config.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #312e81 100%);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .college-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .college-header h1 {
            color: #1e3a8a;
            font-size: 24px;
            font-weight: 800;
        }

        .college-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .demo-credentials-box {
            margin-top: 25px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .demo-credentials-box h4 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cred-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .fill-btn {
            background: #e0e7ff;
            color: #3730a3;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .fill-btn:hover {
            background: #c7d2fe;
        }

        .alert-error {
            padding: 12px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .alert-logout {
            padding: 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .home-link:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="college-header">
            <h1>Apex Institute of Technology</h1>
            <p>Online Examination Portal</p>
        </div>

        <div th:if="${param.error}" class="alert-error">
            Invalid username or password. Please try again.
        </div>

        <div th:if="${param.logout}" class="alert-logout">
            You have successfully logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Institutional ID / Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. user, faculty, admin" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Sign In to Examination Portal</button>
        </form>

        <div class="demo-credentials-box">
            <h4>Institution Roles & Demo Logins:</h4>
            <div class="cred-item">
                <span>🎓 <strong>Student:</strong> <code>user</code> / <code>Exam@123</code></span>
                <button type="button" class="fill-btn" onclick="fillCreds('user', 'Exam@123')">Fill</button>
            </div>
            <div class="cred-item">
                <span>👨‍🏫 <strong>Faculty:</strong> <code>faculty</code> / <code>Faculty@123</code></span>
                <button type="button" class="fill-btn" onclick="fillCreds('faculty', 'Faculty@123')">Fill</button>
            </div>
            <div class="cred-item">
                <span>🏛️ <strong>Admin:</strong> <code>admin</code> / <code>Admin@123</code></span>
                <button type="button" class="fill-btn" onclick="fillCreds('admin', 'Admin@123')">Fill</button>
            </div>
        </div>

        <a href="/" class="home-link">← Return to Public Homepage</a>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
