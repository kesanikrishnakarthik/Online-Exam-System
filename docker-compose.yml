version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collegeconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-onlineexamdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-onlineexamdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - collegeconnect_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: collegeconnect-app:latest
    container_name: collegeconnect_backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-onlineexamdb}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres_secure_2026}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      APP_SEED_TEST_DATA: ${APP_SEED_TEST_DATA:-false}
      APP_CLEAN_DEMO_DATA: ${APP_CLEAN_DEMO_DATA:-false}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    networks:
      - collegeconnect_net

networks:
  collegeconnect_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
