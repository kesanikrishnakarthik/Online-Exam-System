version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: collegeconnect-app:latest
    container_name: collegeconnect_backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/app/data/onlineexamdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
    volumes:
      - collegeconnect_data:/app/data

volumes:
  collegeconnect_data:
    driver: local
